<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bioplot Example</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/bioplot@latest/dist/bioplot.min.js"></script>
</head>
<body>
  <div id="plot" style="width:800px;height:600px;"></div>
  <script>
    // Sample data
    const data = [
      {x: 1, y: 2},
      {x: 2, y: 3},
      {x: 3, y: 5},
      {x: 4, y: 7}
    ];
    // Initialize Bioplot
    const plot = new Bioplot('#plot');
    plot.line(data);
  </script>
</body>
</html>
